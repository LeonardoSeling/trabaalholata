<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚙️ Painel Admin - Latinhas</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Estilos específicos para a página Admin */
    .container-admin { width: 100%; max-width: 600px; margin-top: 20px; }
    .card-login { background: rgba(255,255,255,0.1); padding: 30px; border-radius: 10px; text-align: center; }
    .input-senha { padding: 10px; width: 100%; max-width: 300px; border-radius: 5px; border: none; margin: 15px 0; font-size: 1rem; }
    .btn-acao { background: #4caf50; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    .btn-acao:hover { background: #45a049; }
    .oculto { display: none !important; }
    .controles-placar { display: flex; gap: 5px; align-items: center; }
    .btn-ajuste { padding: 5px 10px; border: none; border-radius: 3px; cursor: pointer; font-weight: bold; color: white; }
    .btn-menos { background: #f44336; }
    .btn-mais { background: #2196f3; }
    .input-qtd { width: 60px; padding: 5px; text-align: center; border-radius: 3px; border: none; }
    .btn-logout { background: transparent; color: #ff8888; border: 1px solid #ff8888; padding: 5px 10px; border-radius: 5px; cursor: pointer; float: right; }
  </style>
</head>
<body>

  <header>
    <h1>⚙️ Painel do Administrador</h1>
    <p>Gerencie a pontuação das turmas com segurança.</p>
  </header>

  <main class="container-admin">
    <!-- 1. Tela de Login -->
    <section id="tela-login" class="card-login">
      <h2>Digite a Senha Master</h2>
      <input type="password" id="campo-senha" class="input-senha" placeholder="Senha do arquivo .env">
      <br>
      <button id="btn-entrar" class="btn-acao">Entrar no Painel</button>
      <p id="erro-login" style="color: #ff8888; margin-top: 10px; font-weight: bold;"></p>
    </section>

    <!-- 2. Painel de Controle (Escondido antes do login) -->
    <section id="painel-controle" class="oculto">
      <button id="btn-sair" class="btn-logout">Sair / Bloquear</button>
      <h2 style="margin-bottom: 20px;">🏆 Atualizar Placar</h2>
      
      <table>
        <thead>
          <tr>
            <th>Turma</th>
            <th>Ações Rápidas</th>
          </tr>
        </thead>
        <tbody id="tabela-admin-corpo">
          <!-- Inserido dinamicamente via JS -->
        </tbody>
      </table>
    </section>
  </main>

  <footer>
    <a href="index.html" class="btn-admin">⬅️ Voltar para o Ranking Público</a>
  </footer>

  <script src="admin.js"></script>
</body>
</html>
